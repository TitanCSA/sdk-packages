[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"
[project]
name = "fyrainput-gamepad"
version = "1.0.0"
description = "Direct Windows x64 FyraInput-Gamepad input SDK with native receive, edit, send, descriptors and cancellation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
[project.urls]
Repository = "https://github.com/TitanCSA/FyraInput-Gamepad-SDK"
Documentation = "https://github.com/TitanCSA/FyraInput-Gamepad-SDK/tree/main/FyraInput-Gamepad-Python-pypi/docs"
[tool.setuptools]
packages = ["fyrainput_gamepad"]
[tool.setuptools.package-data]
fyrainput_gamepad = ["FyraInputGamepadBridge.dll"]
[tool.setuptools.data-files]
"share/doc/fyrainput-gamepad" = ["docs/API.md", "examples/info.py", "LICENSE"]
