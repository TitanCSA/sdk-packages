[build-system]
requires=["setuptools>=77","wheel>=0.43"]
build-backend="setuptools.build_meta"
[project]
name="fyradevice"
version="1.0.0"
description="Windows x64 FyraDevice direct SDK"
requires-python=">=3.10"
license="MIT"
readme="README.md"
[project.urls]
Repository="https://github.com/TitanCSA/FyraDevice-SDK"
[tool.setuptools]
packages=["fyradevice"]
[tool.setuptools.package-data]
fyradevice=["*.dll"]
[tool.setuptools.data-files]
"share/fyradevice/docs"=["docs/*","LICENSE"]
