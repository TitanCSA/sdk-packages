name: Publish SDK packages to NuGet
on:
  workflow_dispatch:
    inputs:
      username:
        description: NuGet.org profile name (not email)
        required: true
        default: titancsa
permissions:
  contents: read
concurrency:
  group: publish-nuget
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Verify all reviewed package hashes
        run: python scripts/verify_nuget.py
      - name: Exchange GitHub identity for short-lived NuGet key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ inputs.username }}
      - name: Publish reviewed packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: python scripts/push_nuget.py
