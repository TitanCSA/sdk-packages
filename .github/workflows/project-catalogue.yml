name: Check SDK project catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-catalogue.yml'
      - 'centralized-projects.json'
      - 'projects/**/README.md'
      - 'scripts/verify_project_catalogue.py'
  pull_request:
    paths:
      - '.github/workflows/project-catalogue.yml'
      - 'centralized-projects.json'
      - 'projects/**/README.md'
      - 'scripts/verify_project_catalogue.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_project_catalogue.py
